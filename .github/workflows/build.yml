name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Install Dependencies (ldid)
        run: |
          brew install ldid || true

      - name: Run Build Script
        run: |
          chmod +x compile.sh
          ./compile.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bankai-ZEXInjector-IPA
          path: bankai-ZEXInjector.ipa
